<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="Electronics-Crm- hybrid client fallback and FastAPI MongoDB pipeline">
  <defs>
    <linearGradient id="ecArchBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#041010" /><stop offset="100%" stop-color="#09211d" /></linearGradient>
    <clipPath id="ecAClip"><rect width="1200" height="420" rx="18" /></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      @keyframes b { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
      .ba { animation: b 4.2s ease-in-out infinite; }
      .bb { animation: b 4.2s ease-in-out infinite 0.55s; }
    </style>
  </defs>
  <g clip-path="url(#ecAClip)">
    <rect width="1200" height="420" fill="url(#ecArchBg)" />
    <text x="48" y="44" fill="#2dd4bf" font-size="11.5" font-weight="700" letter-spacing="1.6" class="mono">HYBRID CLOUD / STATIC ARCHITECTURE · REAL-TIME LEDGER RECONCILIATION</text>
    <text x="48" y="72" fill="#ffffff" font-size="24" font-weight="800" class="sans">React 19 SPA → Adaptive API Router → FastAPI JWT + MongoDB / Firebase Sync</text>

    <path d="M185 180 L450 180 L740 180 L1015 180" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="7 7" stroke-opacity="0.7" />

    <g transform="translate(185, 175)"><g class="ba">
      <polygon points="-88,0 0,44 0,60 -88,16" fill="#047857" /><polygon points="0,44 88,0 88,16 0,60" fill="#064e3b" />
      <polygon points="0,-44 88,0 0,44 -88,0" fill="#10b981" stroke="#d1fae5" />
      <g transform="matrix(0.866,0.433,-0.866,0.433,-2,2)"><text x="-44" y="4" fill="#fff" font-size="12" font-weight="800" class="mono">REACT 19 UI</text></g>
    </g></g>
    <g transform="translate(56, 260)"><rect width="256" height="110" rx="10" fill="#081f1a" stroke="#10b981" stroke-opacity="0.4" />
      <text x="14" y="24" fill="#34d399" font-size="11.5" font-weight="700" class="mono">1. PRESENTATION &amp; QUERY</text>
      <text x="14" y="48" fill="#e2e8f0" font-size="12" class="sans">• 12 pages via HashRouter</text>
      <text x="14" y="68" fill="#e2e8f0" font-size="12" class="sans">• TanStack Query v5 caching</text>
      <text x="14" y="88" fill="#a7f3d0" font-size="12" class="sans">• Printable invoices &amp; WhatsApp</text>
    </g>

    <g transform="translate(450, 175)"><g class="bb">
      <polygon points="-88,0 0,44 0,60 -88,16" fill="#0f766e" /><polygon points="0,44 88,0 88,16 0,60" fill="#115e59" />
      <polygon points="0,-44 88,0 0,44 -88,0" fill="#14b8a6" stroke="#ccfbf1" />
      <g transform="matrix(0.866,0.433,-0.866,0.433,-2,2)"><text x="-46" y="4" fill="#fff" font-size="12" font-weight="800" class="mono">API ADAPTER</text></g>
    </g></g>
    <g transform="translate(328, 260)"><rect width="248" height="110" rx="10" fill="#081f20" stroke="#2dd4bf" stroke-opacity="0.4" />
      <text x="14" y="24" fill="#5eead4" font-size="11.5" font-weight="700" class="mono">2. RESILIENT CLIENT ROUTER</text>
      <text x="14" y="48" fill="#e2e8f0" font-size="12" class="sans">• Probes VITE_API_URL REST host</text>
      <text x="14" y="68" fill="#e2e8f0" font-size="12" class="sans">• Auto Pages handleMockApi mode</text>
      <text x="14" y="88" fill="#99f6e4" font-size="12" class="sans">• Firebase realtime sync listener</text>
    </g>

    <g transform="translate(740, 175)"><g class="ba">
      <polygon points="-88,0 0,44 0,60 -88,16" fill="#b45309" /><polygon points="0,44 88,0 88,16 0,60" fill="#78350f" />
      <polygon points="0,-44 88,0 0,44 -88,0" fill="#f59e0b" stroke="#fef3c7" />
      <g transform="matrix(0.866,0.433,-0.866,0.433,-2,2)"><text x="-46" y="4" fill="#1c1917" font-size="12" font-weight="800" class="mono">FASTAPI CORE</text></g>
    </g></g>
    <g transform="translate(600, 260)"><rect width="268" height="110" rx="10" fill="#1f160a" stroke="#f59e0b" stroke-opacity="0.4" />
      <text x="14" y="24" fill="#fbbf24" font-size="11.5" font-weight="700" class="mono">3. BUSINESS &amp; GST ENGINE</text>
      <text x="14" y="48" fill="#e2e8f0" font-size="12" class="sans">• Bcrypt + HS256 JWT + RBAC</text>
      <text x="14" y="68" fill="#e2e8f0" font-size="12" class="sans">• Stock deduction &amp; restoration</text>
      <text x="14" y="88" fill="#fde68a" font-size="12" class="sans">• Credit aging &amp; ITC P&amp;L math</text>
    </g>

    <g transform="translate(1015, 175)"><g class="bb">
      <polygon points="-88,0 0,44 0,60 -88,16" fill="#1d4ed8" /><polygon points="0,44 88,0 88,16 0,60" fill="#1e3a8a" />
      <polygon points="0,-44 88,0 0,44 -88,0" fill="#3b82f6" stroke="#dbeafe" />
      <g transform="matrix(0.866,0.433,-0.866,0.433,-2,2)"><text x="-44" y="4" fill="#fff" font-size="12" font-weight="800" class="mono">MONGO + DOCS</text></g>
    </g></g>
    <g transform="translate(888, 260)"><rect width="256" height="110" rx="10" fill="#0d182b" stroke="#3b82f6" stroke-opacity="0.4" />
      <text x="14" y="24" fill="#60a5fa" font-size="11.5" font-weight="700" class="mono">4. PERSISTENCE &amp; CI</text>
      <text x="14" y="48" fill="#e2e8f0" font-size="12" class="sans">• Async Motor MongoDB driver</text>
      <text x="14" y="68" fill="#e2e8f0" font-size="12" class="sans">• GitHub Actions Pages deploy</text>
      <text x="14" y="88" fill="#bfdbfe" font-size="12" class="sans">• Docker Compose 3-tier stack</text>
    </g>

    <circle r="5" fill="#2dd4bf"><animateMotion dur="2.6s" repeatCount="indefinite" path="M185 180 L450 180 L740 180 L1015 180" /></circle>
  </g>
</svg>
