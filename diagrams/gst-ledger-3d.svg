<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" role="img" aria-label="Electronics-Crm- 3D GST ITC Waterfall and Multi-Tranche Credit Aging">
  <defs>
    <linearGradient id="crmBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041214" />
      <stop offset="50%" stop-color="#0b1f22" />
      <stop offset="100%" stop-color="#050e12" />
    </linearGradient>
    <pattern id="crmGrid3" width="52" height="30" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 52 15 L 26 30 L 0 15 Z" fill="none" stroke="#134e4a" stroke-width="0.65" stroke-opacity="0.5" />
    </pattern>
    <style>
      @keyframes crUp { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      @keyframes crDown { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(6px); } }
      @keyframes crDash { to { stroke-dashoffset: -42; } }
      .cr-a { animation: crUp 4.5s ease-in-out infinite; }
      .cr-b { animation: crDown 5.1s ease-in-out infinite; }
      .cr-wire { stroke-dasharray: 6 5; animation: crDash 1.6s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#crmBg3)" />
  <rect width="1200" height="420" rx="18" fill="url(#crmGrid3)" />
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#115e59" stroke-width="1.5" />

  <text x="44" y="42" fill="#2dd4bf" font-family="Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.5">18% GST INPUT TAX CREDIT · MULTI-TRANCHE CREDIT AGING · DUAL PERSISTENCE</text>
  <text x="44" y="72" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">3D Wholesale Ledger, GST Offset &amp; Adaptive API Fallback Flow</text>

  <path d="M 384,225 L 434,225 M 784,225 L 834,225" fill="none" stroke="#2dd4bf" stroke-width="2.5" class="cr-wire" />

  <!-- Column 1: Stock & Tranche Engine -->
  <g transform="translate(44, 110)">
    <g class="cr-a">
      <rect x="0" y="0" width="340" height="266" rx="14" fill="#07191e" stroke="#10b981" stroke-opacity="0.7" />
      <g transform="translate(170, 62)">
        <polygon points="0,-24 44,-3 0,18 -44,-3" fill="#34d399" />
        <polygon points="-44,-3 0,18 0,40 -44,19" fill="#047857" />
        <polygon points="44,-3 0,18 0,40 44,19" fill="#065f46" />
        <text x="0" y="1" text-anchor="middle" fill="#022c22" font-family="Consolas, monospace" font-size="10" font-weight="800">STOCK LEDGER</text>
      </g>
      <text x="170" y="132" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800">1. Atomic Inventory &amp; Credit</text>
      <text x="20" y="160" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11">opening + purchased - sold</text>
      <text x="20" y="184" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">• Multi-tranche settlement arrays</text>
      <text x="20" y="206" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">• Computes balance, age_days, due flag</text>
      <text x="20" y="228" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">• Per-model Worldtech godown valuation</text>
      <text x="170" y="252" text-anchor="middle" fill="#64748b" font-family="Consolas, monospace" font-size="10.5">backend/server.py (1,386 LOC)</text>
    </g>
  </g>

  <!-- Column 2: 18% GST ITC Engine -->
  <g transform="translate(434, 110)">
    <g class="cr-b">
      <rect x="0" y="0" width="350" height="266" rx="14" fill="#07191e" stroke="#f59e0b" stroke-opacity="0.7" />
      <g transform="translate(175, 62)">
        <polygon points="0,-24 44,-3 0,18 -44,-3" fill="#fbbf24" />
        <polygon points="-44,-3 0,18 0,40 -44,19" fill="#b45309" />
        <polygon points="44,-3 0,18 0,40 44,19" fill="#92400e" />
        <text x="0" y="1" text-anchor="middle" fill="#451a03" font-family="Consolas, monospace" font-size="10" font-weight="800">18% GST ITC</text>
      </g>
      <text x="175" y="132" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800">2. Inclusive GST &amp; ITC Waterfall</text>
      <text x="20" y="160" fill="#fde68a" font-family="Consolas, monospace" font-size="11">net_gst = output_gst - input_itc</text>
      <text x="20" y="184" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">• Separates base cost vs 18% GST credit</text>
      <text x="20" y="206" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">• Tracks ITC Credit Carried Forward</text>
      <text x="20" y="228" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">• Owner-gated P&amp;L &amp; CSV ledger export</text>
      <text x="175" y="252" text-anchor="middle" fill="#64748b" font-family="Consolas, monospace" font-size="10.5">6/6 backend pytest passing</text>
    </g>
  </g>

  <!-- Column 3: Resilient Client Router -->
  <g transform="translate(834, 110)">
    <g class="cr-a">
      <rect x="0" y="0" width="322" height="266" rx="14" fill="#07191e" stroke="#38bdf8" stroke-opacity="0.7" />
      <g transform="translate(161, 62)">
        <polygon points="0,-24 44,-3 0,18 -44,-3" fill="#38bdf8" />
        <polygon points="-44,-3 0,18 0,40 -44,19" fill="#0369a1" />
        <polygon points="44,-3 0,18 0,40 44,19" fill="#075985" />
        <text x="0" y="1" text-anchor="middle" fill="#082f49" font-family="Consolas, monospace" font-size="10" font-weight="800">API -> MOCK</text>
      </g>
      <text x="161" y="132" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800">3. FastAPI / Firebase / Static</text>
      <text x="18" y="160" fill="#7dd3fc" font-family="Consolas, monospace" font-size="11">frontend/src/api.ts + auth.tsx</text>
      <text x="18" y="184" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">• Live JWT + Passlib bcrypt RBAC</text>
      <text x="18" y="206" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">• Optional Firebase multi-tablet sync</text>
      <text x="18" y="228" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">• Deterministic GitHub Pages fallback</text>
      <text x="161" y="252" text-anchor="middle" fill="#64748b" font-family="Consolas, monospace" font-size="10.5">Live: ridhaant.github.io/Electronics-Crm-</text>
    </g>
  </g>
</svg>
