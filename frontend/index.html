<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Soneja Electronics | Distribution CRM & Inventory Master</title>
    <meta name="description" content="Distribution and inventory management CRM for Soneja Electronics - TV distribution, dealer billing, live stock tracking, and financial analytics." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // 1. Clean up any rogue service workers from other apps on this domain (e.g. Gem-Vault)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) { r.unregister(); }
        });
      }
      // 2. Fix space typos or encoded spaces from browser address bar
      var rawPath = window.location.pathname;
      if (rawPath.includes('%20') || rawPath.includes(' ')) {
        var cleanPath = rawPath.replace(/%20/g, '').replace(/ /g, '');
        window.location.replace(window.location.origin + cleanPath + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
